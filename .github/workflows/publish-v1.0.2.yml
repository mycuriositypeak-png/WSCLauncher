name: Publish WSCLauncher 1.0.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.0.2.yml"

permissions:
  contents: write

env:
  NDK_VERSION: "27.2.12479018"
  RELEASE_TAG: "v1.0.2"
  RELEASE_VERSION: "1.0.2"

jobs:
  publish:
    name: Build and publish v1.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate app version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("app/build.gradle.kts").read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("Could not read versionName")
          print(match.group(1))
          PY
          )"
          test "${APP_VERSION}" = "${RELEASE_VERSION}" || {
            echo "Expected app version ${RELEASE_VERSION}, got ${APP_VERSION}."
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "${SDKMANAGER}" && test -x "${SDKMANAGER}" || {
            echo "sdkmanager not found under ANDROID_HOME=${ANDROID_HOME}"
            exit 1
          }
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WSC_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64}"
          mkdir -p "${RUNNER_TEMP}/wsc-signing"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/wsc-signing/release.jks"
          chmod 600 "${RUNNER_TEMP}/wsc-signing/release.jks"
          test -s "${RUNNER_TEMP}/wsc-signing/release.jks"

      - name: Build native host and Player Roles
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-native.py --ndk "${ANDROID_HOME}/ndk/${NDK_VERSION}"

      - name: Run Player Roles host tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/player-roles/build/host-tests

          g++ -std=c++17 -Wall -Wextra -Werror -I native/include \
            examples/player-roles/callback_test.cpp \
            -o examples/player-roles/build/host-tests/callback-test
          examples/player-roles/build/host-tests/callback-test

          g++ -std=c++17 -Wall -Wextra -Werror \
            examples/player-roles/selection_policy_test.cpp \
            -o examples/player-roles/build/host-tests/policy-test
          examples/player-roles/build/host-tests/policy-test

          g++ -std=c++17 -Wall -Wextra -Werror -I native/include \
            examples/player-roles/profile_test.cpp \
            -o examples/player-roles/build/host-tests/profile-test
          examples/player-roles/build/host-tests/profile-test

      - name: Test, lint and build signed APKs
        shell: bash
        env:
          WSC_RELEASE_STORE_FILE: ${{ runner.temp }}/wsc-signing/release.jks
          WSC_RELEASE_STORE_PASSWORD: ${{ secrets.WSC_RELEASE_STORE_PASSWORD }}
          WSC_RELEASE_KEY_ALIAS: ${{ secrets.WSC_RELEASE_KEY_ALIAS }}
          WSC_RELEASE_KEY_PASSWORD: ${{ secrets.WSC_RELEASE_KEY_PASSWORD }}
          WSC_REQUIRE_RELEASE_SIGNING: "true"
        run: |
          set -euo pipefail
          test -n "${WSC_RELEASE_STORE_PASSWORD}"
          test -n "${WSC_RELEASE_KEY_ALIAS}"
          test -n "${WSC_RELEASE_KEY_PASSWORD}"
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:assembleRelease

      - name: Validate signed APKs
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"

          UNIVERSAL="${OUT}/WSCLauncher-${RELEASE_VERSION}-universal.apk"
          ARM64="${OUT}/WSCLauncher-${RELEASE_VERSION}-arm64.apk"
          ARM32="${OUT}/WSCLauncher-${RELEASE_VERSION}-arm32.apk"

          test -f "${UNIVERSAL}"
          test -f "${ARM64}"
          test -f "${ARM32}"
          test "$(find "${OUT}" -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 3

          for apk in "${UNIVERSAL}" "${ARM64}" "${ARM32}"; do
            "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "${apk}"
            "${BUILD_TOOLS}/aapt" dump badging "${apk}" | grep -q "versionName='${RELEASE_VERSION}'"
          done

          zipinfo -1 "${UNIVERSAL}" | grep -qx 'lib/arm64-v8a/libwscmodhost.so'
          zipinfo -1 "${UNIVERSAL}" | grep -qx 'lib/armeabi-v7a/libwscmodhost.so'
          zipinfo -1 "${ARM64}" | grep -qx 'lib/arm64-v8a/libwscmodhost.so'
          if zipinfo -1 "${ARM64}" | grep -q '^lib/armeabi-v7a/'; then exit 1; fi
          zipinfo -1 "${ARM32}" | grep -qx 'lib/armeabi-v7a/libwscmodhost.so'
          if zipinfo -1 "${ARM32}" | grep -q '^lib/arm64-v8a/'; then exit 1; fi

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "app/build/outputs/apk/release/WSCLauncher-${RELEASE_VERSION}-universal.apk" dist/
          cp "app/build/outputs/apk/release/WSCLauncher-${RELEASE_VERSION}-arm64.apk" dist/
          cp "app/build/outputs/apk/release/WSCLauncher-${RELEASE_VERSION}-arm32.apk" dist/

          PLAYER_ROLES_ZIP="$(find examples/player-roles -maxdepth 1 -type f -name 'wsc-player-roles-picker-v*.zip' | sort -V | tail -n 1)"
          test -n "${PLAYER_ROLES_ZIP}"
          cp "${PLAYER_ROLES_ZIP}" dist/

          (
            cd dist
            sha256sum WSCLauncher-*.apk wsc-player-roles-picker-v*.zip > SHA256SUMS.txt
          )

          cat > release-notes.md <<'EOF'
          ## WSCLauncher 1.0.2

          Maintenance release improving guest startup reliability.

          ### 🛠️ Fixes

          - Restores the installed game's Firebase provider lifecycle before the guest Application starts.
          - Prevents the FirebaseApp / SessionManager startup deadlock observed before Cocos initialization.
          - Preserves the guest context fix introduced in 1.0.1 and Native Mod ABI v1.
          - Adds provider lifecycle regression coverage and additional startup diagnostics.

          ### 📦 Downloads

          - **Universal** — recommended for most devices.
          - **ARM64** — for ARM64 installations of World Soccer Champs.
          - **ARM32** — for ARM32 installations, including ARM64 devices running an ARM32 WSC build.
          - **Player Roles Picker 0.4** — example native mod tested on ARM64 and ARM32.

          ### 🔐 Verification

          SHA-256 checksums are included in `SHA256SUMS.txt`.

          > WSCLauncher is an unofficial community project and does not include World Soccer Champs, its APK, assets, or proprietary game libraries.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.before }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" dist/* \
            --target "${RELEASE_TARGET}" \
            --title "WSCLauncher ${RELEASE_VERSION}" \
            --notes-file release-notes.md
